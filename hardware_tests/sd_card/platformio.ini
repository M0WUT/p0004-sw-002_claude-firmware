; Hardware test: SD card on SDMMC1 (4-bit) with STM32duino STM32SD + FatFs, under FreeRTOS.
; Non-destructive: only creates/deletes files in /GTETEST. Run via pytest (test_sd_card.py).
[env:sd_card]
platform = ststm32
board = devebox_h743vitx
framework = arduino
board_build.f_cpu = 480000000L
lib_deps =
  stm32duino/STM32duino STM32SD @ 1.5.0
  https://github.com/stm32duino/FatFs.git#4.0.4
  stm32duino/STM32duino FreeRTOS @ 10.3.2
upload_protocol = stlink
debug_tool = stlink
build_flags = -I include

