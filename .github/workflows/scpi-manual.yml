# Builds the SCPI manual from the /** @scpi */ comments and publishes it to GitHub Pages.
# All logic lives in p0004-sw-003_scpi-manual-generator, cloned fresh each run.
name: SCPI manual
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  artifacts:
    runs-on: ubuntu-latest
    steps:
      - name: Everything
        run: |
          git clone ${{ github.server_url }}/${{ github.repository }} checkout
          git clone --depth 1 https://github.com/M0WUT/p0004-sw-003_scpi-manual-generator.git scpi_manual_generator
          pip install -r scpi_manual_generator/requirements.txt

          cd checkout
          python3 ../scpi_manual_generator/generate_manual.py --out ../build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/

  # Deploy job
  deploy:
    needs: artifacts
    # Grant GITHUB_TOKEN the permissions required to make a Pages deployment
    permissions:
      pages: write      # to deploy to Pages
      id-token: write   # to verify the deployment originates from an appropriate source

    # Deploy to the github-pages environment
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Webpage URL
        run: echo ${{ steps.deployment.outputs.page_url }}
