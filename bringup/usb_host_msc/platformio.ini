; THROWAWAY spike for the wayfinder ticket "USB spike on the LCD Board" - never merged.
[env:spike]
platform = ststm32
board = devebox_h743vitx
framework = arduino
board_build.f_cpu = 480000000L
lib_ldf_mode = deep+
build_flags =
  -I include
  -D CFG_TUSB_MCU=OPT_MCU_STM32H7
lib_deps =
  stm32duino/STM32duino FreeRTOS @ 10.3.2
upload_protocol = stlink
debug_tool = stlink
monitor_port = /dev/ttyACM0
monitor_speed = 115200

; Stage 2: host on OTG_FS (rhport 0) + device CDC+MSC on OTG_HS internal FS PHY (rhport 1)
[env:stage2]
extends = env:spike
build_flags =
  ${env:spike.build_flags}
  -D SPIKE_DEVICE=1

; Stage 3: stage 2 + the host-port stick exposed to the PC as read-only LUN 1 (async MSC pass-through)
[env:stage3]
extends = env:spike
build_flags =
  ${env:spike.build_flags}
  -D SPIKE_DEVICE=1
  -D SPIKE_PASSTHROUGH=1

; Storage: CDC + MSC drive 0 = SD card (raw blocks, PC owns it read/write while not Logging)
;          + MSC drive 1 = host-port USB stick (read-only pass-through). Enumerates as CAFE:4005.
[env:storage]
extends = env:spike
lib_deps =
  ${env:spike.lib_deps}
  stm32duino/STM32duino STM32SD @ 1.5.0
  https://github.com/stm32duino/FatFs.git#4.0.4
build_flags =
  ${env:spike.build_flags}
  -D SPIKE_DEVICE=1
  -D SPIKE_PASSTHROUGH=1
  -D GTE_LUN0_SD=1
  -D GTE_USB_PID=0x4005
