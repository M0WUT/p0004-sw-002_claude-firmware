; Hardware test: debug UART (USART2, PD5 TX / PD6 RX) through the STLINK-V3 VCP on CN4.
; Run with: python3 hardware_tests/debug_uart/run_test.py
[env:debug_uart]
platform = ststm32
board = devebox_h743vitx
framework = arduino
board_build.f_cpu = 480000000L
upload_protocol = stlink
debug_tool = stlink
