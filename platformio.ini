; GTE Core firmware (P0004-SW-002).
; Environments are named after the LCD Board they run on (p0004-pcb-001_v1), and Applications
; build as <board>-<app> (e.g. p0004-pcb-001_v1-example). Boards are defined in boards/ and
; variants/; no third-party dev board definition is used.
[platformio]
boards_dir = boards
default_envs = p0004-pcb-001_v1

[gte]
platform = ststm32 @ 20.0.0
framework = arduino
board_build.variants_dir = variants
build_flags =
  -I include
  ; Every lib/ library sees every other's headers (see lib_deps below)
  -I lib/drivers/src
  -I lib/helpers/src
  -I lib/services/src
  -I lib/application_services/src
  ; printf/snprintf with %f (newlib-nano leaves it out by default)
  -D PIO_FRAMEWORK_ARDUINO_NANOLIB_FLOAT_PRINTF
  ; FreeRTOS hooks: Core's handlers replace the library's (see lib/services/src/gte/gte.cc)
  -Wl,--wrap=vApplicationStackOverflowHook
  -Wl,--wrap=vApplicationMallocFailedHook
extra_scripts =
  pre:scripts/version_numbering.py
; lib/ holds four libraries (see lib/README.md) that include each other in both
; directions. All four are listed, rather than found from #includes, their headers are
; on the global include path (build_flags above), and their objects are linked
; directly rather than as archives, so the build never depends on library order.
lib_archive = no
lib_deps =
  stm32duino/STM32duino FreeRTOS @ 10.3.2
  drivers
  helpers
  services
  application_services
upload_protocol = stlink
debug_tool = stlink
monitor_speed = 115200

[env:p0004-pcb-001_v1]
extends = gte
board = p0004_pcb_001_v1

; Test Application for the hardware suite (hardware_tests/apps/test), never shipped.
; Real EEPROM: config storage is tested on the chip itself.
[env:p0004-pcb-001_v1-test]
extends = gte
board = p0004_pcb_001_v1
build_src_filter = +<*> +<../hardware_tests/apps/test/>

; The same with DEBUG_EEPROM: config in RAM only, lost at every reset.
[env:p0004-pcb-001_v1-test-ram]
extends = env:p0004-pcb-001_v1-test
build_flags =
  ${gte.build_flags}
  -D DEBUG_EEPROM

; Config version 2 (1->2 migrations; TEST_AUX's block grows).
[env:p0004-pcb-001_v1-test-v2]
extends = env:p0004-pcb-001_v1-test
build_flags =
  ${gte.build_flags}
  -D TEST_CONFIG_VERSION=2

; Config version 3 with no 1->2 step for APPLICATION_TEST.
[env:p0004-pcb-001_v1-test-v3gap]
extends = env:p0004-pcb-001_v1-test
build_flags =
  ${gte.build_flags}
  -D TEST_CONFIG_VERSION=3
